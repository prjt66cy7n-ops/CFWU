name: iPad build and smoke test
on:
  push:
    branches: [main]
    paths:
      - 'YourFarmWithUnicorns/**'
      - 'YourFarmWithUnicorns.xcodeproj/**'
      - 'YourFarmWithUnicornsTests/**'
      - 'YourFarmWithUnicornsUITests/**'
      - '.github/workflows/ipad.yml'
      - 'scripts/prepare-app-icon.swift'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPad simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open('/tmp/devices.json'))
          devices = [d for runtime, group in data['devices'].items() if 'iOS' in runtime for d in group if 'iPad' in d['name'] and d.get('isAvailable')]
          if not devices:
              raise SystemExit('No available iPad simulator runtime')
          print('IPAD_SIMULATOR_ID=' + devices[0]['udid'])
          PY
      - name: Build and run model and iPad UI smoke tests
        shell: bash
        run: |
          set +e
          xcodebuild test -project YourFarmWithUnicorns.xcodeproj -scheme YourFarmWithUnicorns -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR_ID" -derivedDataPath DerivedData -resultBundlePath NativeTests.xcresult -jobs 3 CODE_SIGNING_ALLOWED=NO > native-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            xcrun xcresulttool get --legacy --format json --path NativeTests.xcresult > /tmp/native-results.json
            python3 - <<'PY'
          import json
          data = json.load(open('/tmp/native-results.json'))
          metrics = data.get('metrics', {})
          def count(name): return int(metrics.get(name, {}).get('_value', 0))
          total, failed, skipped = count('testsCount'), count('testsFailedCount'), count('testsSkippedCount')
          print(f'::notice::Native iPad tests: {total} executed, {failed} failed, {skipped} skipped.')
          if total < 35 or failed or skipped:
              raise SystemExit('Required native tests did not all execute successfully')
          PY
          fi
          tail -n 100 native-tests.log
          {
            echo '## iPad simulator test output'
            echo '```'
            tail -n 100 native-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|failed|Failure' native-tests.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Build optimized Release app for iPad simulator
        shell: bash
        run: |
          set +e
          xcodebuild build -project YourFarmWithUnicorns.xcodeproj -scheme YourFarmWithUnicorns -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedDataRelease -jobs 3 CODE_SIGNING_ALLOWED=NO > release-build.log 2>&1
          status=$?
          set -e
          tail -n 60 release-build.log
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|failed|Failure' release-build.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
